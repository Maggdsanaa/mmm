name: Build
on:
  push:
  workflow_dispatch:
jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unit tests (codes + crypto + protocol + roster)
        run: gradle :core:testDebugUnitTest --stacktrace
      - name: Build debug APKs
        run: gradle :student:assembleDebug :doctor:assembleDebug :admin:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: student-app
          path: student/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-app
          path: doctor/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: admin-app
          path: admin/build/outputs/apk/debug/*.apk
